<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-label="LIUCAN terminal">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="0.55" stop-color="#0b1024"/>
      <stop offset="1" stop-color="#120b2d"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ff4ecd"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#6d5dfc" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#ffffff" opacity="0.012"/>
    </pattern>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Noto Sans Mono CJK SC",monospace}
      .fade1{opacity:0;animation:show .45s ease .25s forwards}.fade2{opacity:0;animation:show .45s ease .65s forwards}.fade3{opacity:0;animation:show .45s ease 1.05s forwards}.fade4{opacity:0;animation:show .45s ease 1.45s forwards}.fade5{opacity:0;animation:show .45s ease 1.85s forwards}.fade6{opacity:0;animation:show .45s ease 2.25s forwards}.fade7{opacity:0;animation:show .45s ease 2.65s forwards}
      .blink{animation:blink 1s steps(1,end) infinite}.pulse{animation:pulse 3s ease-in-out infinite}.bar{stroke-dasharray:565;stroke-dashoffset:565;animation:load 1.7s ease .35s forwards}
      @keyframes show{to{opacity:1}}@keyframes blink{50%{opacity:0}}@keyframes load{to{stroke-dashoffset:0}}@keyframes pulse{50%{opacity:.45}}
    </style>
  </defs>
  <rect width="900" height="360" rx="22" fill="url(#bg)"/>
  <rect width="900" height="360" rx="22" fill="url(#grid)"/>
  <rect width="900" height="360" rx="22" fill="url(#scan)"/>
  <rect x="1" y="1" width="898" height="358" rx="21" fill="none" stroke="url(#neon)" stroke-opacity=".72"/>

  <rect x="0" y="0" width="900" height="48" rx="22" fill="#0d1229"/>
  <rect x="0" y="27" width="900" height="21" fill="#0d1229"/>
  <circle cx="28" cy="24" r="6" fill="#ff5f57"/><circle cx="50" cy="24" r="6" fill="#febc2e"/><circle cx="72" cy="24" r="6" fill="#28c840"/>
  <text x="450" y="30" text-anchor="middle" class="mono" font-size="13" letter-spacing="3" fill="#8da2c9">LIUCAN // GENERATIVE AI CONSOLE</text>
  <circle cx="850" cy="24" r="4" fill="#00e5ff" filter="url(#glow)" class="pulse"/>

  <g class="mono" font-size="16">
    <text x="42" y="83" fill="#00e5ff" class="fade1">› initializing profile...</text>
    <line x1="42" y1="105" x2="607" y2="105" stroke="#14213d" stroke-width="8" stroke-linecap="round"/>
    <line x1="42" y1="105" x2="607" y2="105" stroke="url(#neon)" stroke-width="8" stroke-linecap="round" filter="url(#glow)" class="bar"/>
    <text x="632" y="111" fill="#a7f3d0" class="fade3">100% [OK]</text>

    <text x="42" y="147" fill="#65779c" class="fade3">USER</text><text x="160" y="147" fill="#f8fafc" class="fade3">liucan</text>
    <text x="42" y="177" fill="#65779c" class="fade4">ALIAS</text><text x="160" y="177" fill="#f8fafc" class="fade4">沧浪同学</text>
    <text x="42" y="207" fill="#65779c" class="fade5">FOCUS</text><text x="160" y="207" fill="#c4b5fd" class="fade5">Generative AI · Open Source · Zotero · Legal Tech</text>
    <text x="42" y="237" fill="#65779c" class="fade6">STATUS</text><text x="160" y="237" fill="#67e8f9" class="fade6">BUILDING / EXPLORING / SHARING</text>

    <text x="42" y="287" fill="#00e5ff" class="fade7">›</text>
    <text x="66" y="287" fill="#f4f4f5" font-size="20" font-weight="700" class="fade7">生成式人工智能是21世纪的珍妮机</text>
    <rect x="42" y="312" width="13" height="22" rx="2" fill="#00e5ff" filter="url(#glow)" class="blink fade7"/>
  </g>

  <text x="858" y="337" text-anchor="end" class="mono" font-size="11" fill="#506182">SYS:ONLINE · NODE:LIU8CAN</text>
</svg>
