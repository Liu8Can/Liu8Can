name: Generate GitHub Trophy

on:
  schedule:
    - cron: "35 0 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/trophy.yml"

permissions:
  contents: write

jobs:
  trophy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Prepare output directory
        run: mkdir -p assets

      - name: Generate trophy SVG
        uses: ryo-ma/github-profile-trophy@master
        with:
          username: Liu8Can
          output_path: assets/github-trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          theme: algolia

      - name: Commit trophy
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-trophy.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh GitHub trophy [skip ci]"
            git pull --rebase origin main
            git push
          fi
