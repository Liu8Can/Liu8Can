name: Generate Activity Graph

on:
  schedule:
    - cron: "50 0 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/activity-graph.yml"

permissions:
  contents: write

jobs:
  activity-graph:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate activity graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: Liu8Can
          options: theme=tokyo-night&hide_border=true&area=true&custom_title=CYBER%20ACTIVITY%20SIGNAL
          output_path: assets/activity-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit activity graph
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity-graph.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh activity graph [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
