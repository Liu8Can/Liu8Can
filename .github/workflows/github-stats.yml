name: Generate GitHub Stats Rank

on:
  schedule:
    - cron: "5 1 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/github-stats.yml"

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate stats rank card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=Liu8Can&show_icons=true&include_all_commits=true&theme=tokyonight&hide_border=true&bg_color=0D1117&title_color=70A5FD&icon_color=BF91F3&text_color=38BDAE&custom_title=liucan%20GitHub%20Stats
          path: assets/github-stats-rank.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Commit stats card
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats-rank.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh GitHub stats rank [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
