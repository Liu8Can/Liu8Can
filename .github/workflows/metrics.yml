name: Cyber Profile Metrics

on:
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/metrics.yml"

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Render overview
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Liu8Can
          filename: metrics-overview.svg
          output_action: none
          base: header, activity, community, repositories
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          config_timezone: Asia/Shanghai

      - name: Render isometric calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Liu8Can
          filename: metrics-calendar.svg
          output_action: none
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_timezone: Asia/Shanghai

      - name: Render code change history
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Liu8Can
          filename: metrics-lines.svg
          output_action: none
          base: ""
          plugin_lines: yes
          plugin_lines_delay: 30
          plugin_lines_sections: repositories, history
          plugin_lines_repositories_limit: 4
          plugin_lines_history_limit: 1
          config_timezone: Asia/Shanghai

      - name: Publish metrics
        shell: bash
        run: |
          mkdir -p assets/metrics
          sudo cp /metrics_renders/metrics-overview.svg assets/metrics/metrics-overview.svg
          sudo cp /metrics_renders/metrics-calendar.svg assets/metrics/metrics-calendar.svg
          sudo cp /metrics_renders/metrics-lines.svg assets/metrics/metrics-lines.svg
          sudo chown -R "$USER":"$USER" assets/metrics
          python - <<'PY'
          from pathlib import Path
          replacements = {
              ">Liu8Can/": ">DanielSong/",
              ">LIU8CAN/": ">DanielSong/",
              ">liucan/": ">DanielSong/",
              ">Liu8Can<": ">DanielSong<",
              ">LIU8CAN<": ">DanielSong<",
              ">liucan<": ">DanielSong<",
          }
          for path in Path("assets/metrics").glob("*.svg"):
              text = path.read_text(encoding="utf-8")
              for old, new in replacements.items():
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/metrics
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh cyber profile metrics [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
