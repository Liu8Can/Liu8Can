name: Cyber Profile Metrics

on:
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/metrics.yml"

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Render overview
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Liu8Can
          filename: metrics-overview.svg
          output_action: none
          base: header, activity, community, repositories
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
          config_timezone: Asia/Shanghai

      - name: Render isometric calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Liu8Can
          filename: metrics-calendar.svg
          output_action: none
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_timezone: Asia/Shanghai

      - name: Render coding habits
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Liu8Can
          filename: metrics-habits.svg
          output_action: none
          base: ""
          plugin_habits: yes
          plugin_habits_from: 300
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_charts_type: graph
          plugin_habits_trim: yes
          config_timezone: Asia/Shanghai

      - name: Publish metrics
        shell: bash
        run: |
          mkdir -p assets/metrics
          sudo cp /metrics_renders/metrics-overview.svg assets/metrics/metrics-overview.svg
          sudo cp /metrics_renders/metrics-calendar.svg assets/metrics/metrics-calendar.svg
          sudo cp /metrics_renders/metrics-habits.svg assets/metrics/metrics-habits.svg
          sudo chown -R "$USER":"$USER" assets/metrics
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/metrics
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh cyber profile metrics [skip ci]"
            git push
          fi
